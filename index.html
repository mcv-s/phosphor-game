<!DOCTYPE html>

<html lang="en">



<head>
    <meta charset="UTF-8">


    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Main Game (In progress)</title>

    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="assets/themeStyles.css">
    <link rel="stylesheet" href="styles.css">




</head>







<style>
    body {
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: var(--bg);
        overflow: hidden;
    }

    .game-window {
        width: 1280px;
        height: 720px;
        background: var(--surface);
        overflow: hidden;
        position: absolute;
    }

    [gameObject] {
        position: absolute;
        left: 0px;
        top: 0px;
    }

    .build-menu {
        background: #413e41;
        width: 90%;
        height: 100px;
        left: 5%;
        top: 85%;
        display: flex;
        flex-direction: row;
    }

    .build-row {
        display: flex;
        flex-direction: row;
        padding-top: 10px;
        padding-left: 10px;
        gap: 10px;
    }



    [buildIcon] {
        font-size: 50px;
    }

    .mouse-follow {
        width: fit-content
    }
</style>









<body>
    <div class="game-window" card>

        <div class="build-menu" gameObject>
            <row class="build-row">
                <i class="ph ph-square" id="square" buildIcon></i>
                <i class="ph ph-house" id="house" buildIcon></i>
                <i class="ph ph-book" id="book" buildIcon></i>
                <i class="ph ph-triangle" id="triangle" buildIcon></i>
            </row>
        </div>

        <div class="follow-mouse" gameObject></div>
        <i class="ph ph-square" id="main-city" gameObject house=2></i>


        <i class="ph ph-square" id="main-city" gameObject house=1></i>







    </div>
</body>















<script src="https://mcv-s.github.io/utils/web/tooltips.js"></script>
<script src="https://mcv-s.github.io/utils/web/gameFunctions.js"></script>
<script src="program.js"></script>


</html>
